<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/account">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
    <ion-title class="b18" style="text-align: center;">Edit Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-text class="b16" style="color: var(--ion-color-dis);">Your name</ion-text>

  <div class="input" style="margin-top: 12px;margin-bottom: 20px;">
    <ion-input placeholder="Anabella Angela" />
  </div>

  <ion-text class="b16" style="color: var(--ion-color-dis);">Occupation</ion-text>

  <div class="input" style="margin-top: 12px;margin-bottom: 20px;">
    <ion-input placeholder="Student" style="flex: 1;" />
    <ion-icon name="chevron-down" style="font-size: 16px;color: var(--ion-color-txt);" />
  </div>

   <ion-text class="b16" style="color: var(--ion-color-dis);">Employer</ion-text>

  <div class="input" style="margin-top: 12px;margin-bottom: 20px;">
    <ion-input placeholder="Overlay Design" style="flex: 1;" />
  </div>

  <ion-text class="b16" style="color: var(--ion-color-dis);">Phone number</ion-text>

  <div class="input" style="margin-top: 12px;margin-bottom: 20px;">
    <ion-input placeholder="(1) 8976 4567 666" style="flex: 1;" />
  </div>

   <ion-text class="b16" style="color: var(--ion-color-dis);">Email</ion-text>

  <div class="input" style="margin-top: 12px;margin-bottom: 20px;">
    <ion-input placeholder="anabelangella@mail.com" style="flex: 1;" />
  </div>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button routerLink="/account" expand="block">Save</ion-button>
  </ion-toolbar>
</ion-footer>
