<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/tabs">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
    <ion-title class="b18" style="text-align: center;">Top Up</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-text class="b18">Bank Transfer</ion-text>

  <ion-modal cssClass="rbsheet" trigger="open-modal5" [initialBreakpoint]="0.8" [breakpoints]="[0, 0.8]"
    handleBehavior="cycle">
    <ng-template>
      <ion-content class="ion-padding">

        <div class="boxo list" style="margin-bottom: 15px;">
          <div class="icon2" style="border-radius: 30px;">
            <ion-img src="../../../../assets/image/s46.png" style="height: 32px;width: 32px;" />
          </div>
          <div style="margin-left: 12px;flex: 1;">
            <ion-text class="s16">Bank of America</ion-text>
            <div style="margin-top: 5px;">
              <ion-text class="m12" style="color: var(--ion-color-dis);">**** **** **** 1990</ion-text>
            </div>
          </div>
          <ion-icon name="chevron-down" style="font-size: 20px;color: #9CA3AF;" />
        </div>

        <ion-text class="b16">Amount</ion-text>

        <div class="list" style="margin-top: 15px;">
          <div class="num">
            <ion-icon name="remove" style="font-size: 20px;color:  var(--ion-color-txt);" />
          </div>
          <div class="input">
            <ion-input placeholder="$ 100" />
          </div>
          <div class="num">
            <ion-icon name="add" style="font-size: 20px;color:  var(--ion-color-txt);" />
          </div>
        </div>

        <ion-img src="../../../../assets/image/s61.png" />

        <div class="list" style="margin-top: 15px;">
          <div class="chip" style="flex: 1;height: 72px;">
            <ion-text class="s14">5%</ion-text>
          </div>
          <div class="chip" style="flex: 1;height: 72px;margin: 0 10px;">
            <ion-text class="s14">10%</ion-text>
          </div>
          <div class="chip" style="flex: 1;height: 72px;">
            <ion-text class="s14">15%</ion-text>
          </div>
          <div class="chip" style="flex: 1;height: 72px;margin-left: 10px;">
            <ion-text class="s14">20%</ion-text>
          </div>
        </div>

         <div class="list" style="margin-top: 15px;">
          <div class="chip" style="flex: 1;height: 72px;">
            <ion-text class="s14">50%</ion-text>
          </div>
          <div class="chip" style="flex: 1;height: 72px;margin: 0 10px;">
            <ion-text class="s14">100%</ion-text>
          </div>
          <div class="chip" style="flex: 1;height: 72px;">
            <ion-text class="s14">200%</ion-text>
          </div>
          <div class="chip" style="flex: 1;height: 72px;background-color: #0A6375;margin-left: 10px;">
            <ion-text class="s14" style="color: #fff;">500%</ion-text>
          </div>
        </div>

        <ion-button (click)="close()" expand="block" style="margin-top: 15px;">Top Up</ion-button>

      </ion-content>
    </ng-template>
  </ion-modal>

  <ion-radio-group value="1">

    <div id="open-modal5" class="boxo list" style="margin-top: 20px;">
      <div class="icon2" style="border-radius: 30px;">
        <ion-img src="../../../../assets/image/s46.png" style="height: 32px;width: 32px;" />
      </div>
      <div style="margin-left: 12px;flex: 1;">
        <ion-text class="s16">Bank of America</ion-text>
        <div style="margin-top: 5px;">
          <ion-text class="m12" style="color: var(--ion-color-dis);">**** **** **** 1990</ion-text>
        </div>
      </div>
      <ion-radio checked="true" value="1"></ion-radio>
    </div>

    <div class="boxo list" style="margin-top: 20px;">
      <div class="icon2" style="border-radius: 30px;">
        <ion-img src="../../../../assets/image/s59.png" style="height: 32px;width: 32px;" />
      </div>
      <div style="margin-left: 12px;flex: 1;">
        <ion-text class="s16">U.S Bank</ion-text>
        <div style="margin-top: 5px;">
          <ion-text class="m12" style="color: var(--ion-color-dis);">**** **** **** 1243</ion-text>
        </div>
      </div>
      <ion-radio value="2"></ion-radio>
    </div>

    <ion-text class="b18">Other</ion-text>

    <div class="boxo list" style="margin-top: 20px;">
      <div class="icon2" style="border-radius: 30px;">
        <ion-img src="../../../../assets/image/s60.png" style="height: 32px;width: 32px;" />
      </div>
      <div style="margin-left: 12px;flex: 1;">
        <ion-text class="s16">Paypal</ion-text>
        <div style="margin-top: 5px;">
          <ion-text class="m12" style="color: var(--ion-color-dis);">Easy payment</ion-text>
        </div>
      </div>
      <ion-radio value="3"></ion-radio>
    </div>

    <div class="boxo list" style="margin-top: 20px;">
      <div class="icon2" style="border-radius: 30px;">
        <ion-icon name="logo-apple" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
      <div style="margin-left: 12px;flex: 1;">
        <ion-text class="s16">Apple pay</ion-text>
        <div style="margin-top: 5px;">
          <ion-text class="m12" style="color: var(--ion-color-dis);">Easy payment</ion-text>
        </div>
      </div>
      <ion-radio value="4"></ion-radio>
    </div>

    <div class="boxo list" style="margin-top: 20px;margin-bottom: 20px;">
      <div class="icon2" style="border-radius: 30px;">
        <ion-img src="../../../../assets/image/s3.png" style="height: 32px;width: 32px;" />
      </div>
      <div style="margin-left: 12px;flex: 1;">
        <ion-text class="s16">Google pay</ion-text>
        <div style="margin-top: 5px;">
          <ion-text class="m12" style="color: var(--ion-color-dis);">Easy payment</ion-text>
        </div>
      </div>
      <ion-radio value="3"></ion-radio>
    </div>

  </ion-radio-group>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button routerLink="/phone" expand="block">Confirm</ion-button>
  </ion-toolbar>
</ion-footer>
