<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/transfer">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
    <ion-title class="b18" style="text-align: center;">Send Money</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div class="column" style="align-items: center;">
    <ion-img src="../../../../assets/image/s42.png" style="height: 110px;width: 110px;" />
  </div>
  <div class="ion-text-center" style="margin-top: 12px;">
    <ion-text class="b14">to Maria</ion-text>
  </div>

  <div class="boxo"
    style="border-color: var(--ion-color-boxl);background-color: var(--ion-color-box);margin-top: 20px;">
    <div class="list1">
      <ion-text class="m12" style="color: var(--ion-color-dis);">Enter amount:</ion-text>
      <ion-text class="m12" style="color: var(--ion-color-dis);">Max $10,250.00</ion-text>
    </div>
    <div class="list" style="margin-top: 10px;">
      <div class="usd">
        <ion-text class="m16" style="color: var(--ion-color-dis);">USD</ion-text>
        <ion-icon name="chevron-down" style="font-size: 14px;color: var(--ion-color-dis);margin-left: 5px;" />
      </div>
      <div class="input">
        <ion-input placeholder="924,0" />
      </div>
    </div>
  </div>

  <ion-modal id="example-modal" #modal trigger="open-custom1">
    <ng-template>
      <div class="wrapper">

        <div class="column" style="align-items: center;margin-top: -18px;">
          <ion-img [src]="darkMode?'../../../../assets/image/s44d.png':'../../../../assets/image/s44.png'"
            style="height: 88px;width: 88px;" />
        </div>

        <div class="ion-text-center" style="margin-top: 15px;">
          <ion-text class="b18">Transfer Confirmation</ion-text>
        </div>

        <div class="list" style="margin-top: 12px;">
          <div style="flex: 1;">
            <ion-text class="r12" style="color: var(--ion-color-dis);">From</ion-text>
            <div style="margin-top: 5px;">
              <ion-text class="b16">Anabella</ion-text>
            </div>
          </div>
          <div class="column" style="flex: 1;align-items: flex-end;">
            <ion-text class="r12" style="color: var(--ion-color-dis);">Bank of America</ion-text>
            <div style="margin-top: 5px;">
              <ion-text class="b16">**** 1990</ion-text>
            </div>
          </div>
        </div>

        <div class="lines" style="margin: 15px 0;"></div>

        <div class="list">
          <div style="flex: 1;">
            <ion-text class="r12" style="color: var(--ion-color-dis);">To</ion-text>
            <div style="margin-top: 5px;">
              <ion-text class="b16">Maria</ion-text>
            </div>
          </div>
          <div class="column" style="flex: 1;align-items: flex-end;">
            <ion-text class="r12" style="color: var(--ion-color-dis);">Citibank Online</ion-text>
            <div style="margin-top: 5px;">
              <ion-text class="b16">**** 7777</ion-text>
            </div>
          </div>
        </div>

        <div class="lines" style="margin: 15px 0;"></div>

        <div class="list1">
          <ion-text class="m16" style="color: var(--ion-color-dis);">Total</ion-text>
          <div style="margin-top: 5px;">
            <ion-text class="b16">$924.02</ion-text>
          </div>
        </div>

        <ion-button (click)="close()" style="margin-top: 20px;" expand="block">Ok, Send Now!</ion-button>

      </div>
    </ng-template>
  </ion-modal>


</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button id="open-custom1" expand="block">Send Money</ion-button>
  </ion-toolbar>
</ion-footer>
