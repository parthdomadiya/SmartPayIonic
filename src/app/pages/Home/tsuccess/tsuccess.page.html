<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/smoney">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div class="column" style="align-items: center;">
    <ion-img [src]="darkMode?'../../../../assets/image/s43d.png':'../../../../assets/image/s43.png'"
      style="height: 217px;width: 260px;" />
  </div>

  <div class="ion-text-center" style="margin-top: 12px;">
    <ion-text class="apptitle">Transfer Successful</ion-text>
  </div>

  <div class="ion-text-center" style="margin-top: 10px;">
    <ion-text class="r14" style="color: var(--ion-color-dis);">Transfers are reviewed which may result in delays or
      funds being frozen</ion-text>
  </div>

  <div class="column" style="align-items: center;">
    <div class="box" style="padding: 25px;margin: 20px 0;">
      <ion-text class="title" style="text-align: center;display: block;">$924.02</ion-text>
    </div>
  </div>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button routerLink="/tabs" expand="block">Back to Home</ion-button>
  </ion-toolbar>
</ion-footer>
