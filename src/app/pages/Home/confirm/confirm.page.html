<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/topup">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
    <ion-title class="b18" style="text-align: center;">Confirmation</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-img src="../../../../assets/image/s22.png" />

  <div class="list1" style="margin-top: 20px;">
    <ion-text class="m16" style="color: var(--ion-color-dis);">Top up balance</ion-text>
    <ion-text class="b16">$1,924.00</ion-text>
  </div>

  <div class="list1" style="margin-top: 20px;">
    <ion-text class="m16" style="color: var(--ion-color-dis);">Fee</ion-text>
    <ion-text class="b16">$2.0</ion-text>
  </div>

  <div class="lines"></div>

  <div class="list1">
    <ion-text class="m16" style="color: var(--ion-color-dis);">Total</ion-text>
    <ion-text class="b16">$1,926.00</ion-text>
  </div>

  <ion-modal cssClass="rbsheet" trigger="open-modal1" [initialBreakpoint]="0.65" [breakpoints]="[0, 0.65]"
    handleBehavior="cycle">
    <ng-template>
      <ion-content class="ion-padding">

        <div class="column" style="align-items: center;">
          <ion-img [src]="darkMode?'../../../../assets/image/s45d.png':'../../../../assets/image/s45.png'"
            style="height: 193px;width: 260px;" />
        </div>

        <div class="ion-text-center" style="margin-top: 15px;">
          <ion-text class="apptitle">Top Up Success</ion-text>
        </div>

         <div class="ion-text-center" style="margin-top: 8px;">
          <ion-text class="r14" style="color: var(--ion-color-dis);">Top up are reviewed which may result in delays or funds being frozen</ion-text>
        </div>

        <ion-button (click)="close()" expand="block" style="margin-top: 20px;">Back to Home</ion-button>

      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button id="open-modal1" expand="block">Confirm Top Up</ion-button>
  </ion-toolbar>
</ion-footer>
