<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/tabs">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
    <ion-title class="b18" style="text-align: center;">Top Up</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div class="boxo list" style="border-color: var(--ion-color-boxl);background-color: var(--ion-color-box);">
    <ion-img src="../../../../assets/image/s22.png" style="height: 24px;width: 42px;" />
    <ion-text class="b18" style="color: var(--ion-color-dis);margin-left: 12px;flex: 1;">Debit</ion-text>
    <ion-text class="b18" style="margin-right: 5px;">$10,250.00</ion-text>
    <ion-icon name="chevron-down" style="font-size: 16px;color: var(--ion-color-txt);" />
  </div>

  <div class="boxo"
    style="border-color: var(--ion-color-boxl);background-color: var(--ion-color-box);margin-top: 20px;">
    <div class="list1">
      <ion-text class="m12" style="color: var(--ion-color-dis);">Enter amount:</ion-text>
      <ion-text class="m12" style="color: var(--ion-color-dis);">Top up fee $2.0</ion-text>
    </div>
    <div class="list" style="margin-top: 10px;">
      <div class="usd">
        <ion-text class="m16" style="color: var(--ion-color-dis);">USD</ion-text>
        <ion-icon name="chevron-down" style="font-size: 14px;color: var(--ion-color-dis);margin-left: 5px;" />
      </div>
      <div class="input">
        <ion-input placeholder="1,924" />
      </div>
    </div>
  </div>

  <div class="list" style="margin-top: 15px;">
    <div class="chip" style="flex: 1;">
      <ion-text class="s14" >$1000.00</ion-text>
    </div>
    <div class="chip" style="flex: 1;margin: 0 10px;">
      <ion-text class="s14" >$2000.00</ion-text>
    </div>
    <div class="chip" style="flex: 1;background-color: #2FA2B9;">
      <ion-text class="s14" style="color: #fff;" >$3000.00</ion-text>
    </div>
  </div>

</ion-content>
<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button routerLink="/confirm" expand="block">Continue</ion-button>
  </ion-toolbar>
</ion-footer>
