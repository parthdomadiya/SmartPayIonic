<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
    <ion-title class="b18" style="text-align: center;">My Card</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-img routerLink="/ecard" src="../../../../assets/image/s21.png" />

  <ion-img routerLink="/ecard" src="../../../../assets/image/s22.png" style="margin-top: 20px;" />

  <div class="box list" style="margin-top: 20px;justify-content: center;margin-bottom: 100px;">
    <ion-icon name="add" style="font-size: 20px;color: var(--ion-color-txt);" />
    <ion-text class="b16" style="margin-left: 8px;">Add new card</ion-text>
  </div>

</ion-content>
