<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/otp">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div class="ion-text-center">
    <ion-text class="apptitle">Enable biometric Access</ion-text>
  </div>
  <div class="ion-text-center" style="margin-top: 5px;">
    <ion-text class="r16" style="color: var(--ion-color-dis);">Login quickly and securely with the fingerprint stored on
      this device</ion-text>
  </div>

  <div class="column" style="align-items: center;margin-top: 40px;">
    <ion-img [src]="darkMode?'../../../../assets/image/s4d.png':'../../../../assets/image/s4.png'"
      style="height: 137px;width: 137px;" />
  </div>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button routerLink="/passr" expand="block">Enable biometric access</ion-button>
    <div class="ion-text-center" style="margin: 10px 0;">
      <ion-text class="b16">I’ll do this later</ion-text>
    </div>
  </ion-toolbar>
</ion-footer>
