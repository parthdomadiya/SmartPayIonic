<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/vid">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <ion-text class="apptitle">Create New Password</ion-text>
  <div style="margin-top: 10px;">
    <ion-text class="r16" style="color: var(--ion-color-dis);">Please, enter a new password below different from the previous password</ion-text>
  </div>

  <ion-item class="input" color="fb" lines="none" style="margin-top: 15px;padding: 0 ;">
    <ion-input type="{{ showPassword ? 'text' : 'password' }}" [(ngModel)]="password" placeholder="New Password"
      style="flex: 1;"></ion-input>
    <ion-icon name="{{ showPassword ? 'eye-off' : 'eye' }}" slot="end" (click)="togglePasswordVisibility()"></ion-icon>
  </ion-item>

  <ion-item class="input" color="fb" lines="none" style="margin-top: 15px;padding: 0 ;margin-bottom: 20px;">
    <ion-input type="{{ showPassword1 ? 'text' : 'password' }}" [(ngModel)]="password1" placeholder=" Confirm Password"
      style="flex: 1;"></ion-input>
    <ion-icon name="{{ showPassword1 ? 'eye-off' : 'eye' }}" slot="end" (click)="togglePasswordVisibility1()"></ion-icon>
  </ion-item>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button routerLink="/login" expand="block">Create new password</ion-button>
  </ion-toolbar>
</ion-footer>
