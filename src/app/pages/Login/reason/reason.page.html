<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/residence">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" >

  <ion-text class="apptitle">Main reason for using Smartpay</ion-text>
  <div style="margin-top: 10px;">
    <ion-text class="r16" style="color: var(--ion-color-dis);">We need to know this for regulatory reasons. And also
      we’re curious!</ion-text>
  </div>

  <div class="list" style="margin-top: 20px;">
    <div class="box column" style="flex: 1;background-color: var(--ion-color-txt);">
      <ion-icon name="pie-chart-outline" style="font-size: 32px;color: var(--ion-color-bg);margin-bottom: 10px;" />
      <ion-text class="s14" style="color: var(--ion-color-bg);">Spend or<br/>save daily</ion-text>
    </div>
    <div class="boxo column" style="flex: 1;margin-left: 10px;">
      <ion-icon name="flash-outline" style="font-size: 32px;color: #2FA2B9;margin-bottom: 10px;" />
      <ion-text class="s14" style="color: var(--ion-color-txt);">Fast my<br/>transactions</ion-text>
    </div>
  </div>

  <div class="list" style="margin-top: 20px;">
    <div class="boxo column" style="flex: 1;margin-right: 10px;">
      <ion-icon name="people-outline" style="font-size: 32px;color: #2FA2B9;margin-bottom: 10px;" />
      <ion-text class="s14" style="color: var(--ion-color-txt);">Payments<br/>to friends</ion-text>
    </div>
    <div class="box column" style="flex: 1;background-color: var(--ion-color-txt);">
      <ion-icon name="card-outline" style="font-size: 32px;color: var(--ion-color-bg);margin-bottom: 10px;" />
      <ion-text class="s14" style="color: var(--ion-color-bg);">Online<br/>payments</ion-text>
    </div>
  </div>

  <div class="list" style="margin-top: 20px;margin-bottom: 20px;">
    <div class="boxo column" style="flex: 1;margin-right: 10px;">
      <ion-img src="../../../../assets/image/s13.png" style="height: 32px;width: 32px;margin-bottom: 10px;" />
      <ion-text class="s14" style="color: var(--ion-color-txt);">Payments<br/>to friends</ion-text>
    </div>
    <div class="boxo column" style="flex: 1;">
      <ion-img src="../../../../assets/image/s14.png" style="height: 32px;width: 32px;margin-bottom: 10px;" />
      <ion-text class="s14" style="color: var(--ion-color-txt);">Your financial<br/>assets</ion-text>
    </div>
  </div>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button routerLink="/pin" expand="block">Continue</ion-button>
  </ion-toolbar>
</ion-footer>
