<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/tabs/card">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
    <ion-title class="b18" style="text-align: center;">Edit Card</ion-title>
  </ion-toolbar>
  <ion-img [src]="darkMode?'../../../../assets/image/s24d.png':'../../../../assets/image/s24.png'"
    style="margin: 10px 15px;" />
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div class="box list" style="padding: 10px;">
    <div class="ion-text-center" style="flex: 1;">
      <ion-text class="m14" style="color: var(--ion-color-dis);">Personal</ion-text>
    </div>
    <div class="chip" style="background-color: var(--ion-color-bg);">
      <ion-text class="b14">Manage</ion-text>
    </div>
    <div class="ion-text-center" style="flex: 1;">
      <ion-text class="m14" style="color: var(--ion-color-dis);">Personal</ion-text>
    </div>
  </div>

  <div class="list" style="margin-top: 20px;">
    <div class="icon2">
      <ion-icon name="card-outline" style="font-size: 24px;color: #2FA2B9;" />
    </div>
    <ion-text class="b14" style="margin-left: 12px;flex: 1;">Freeze physical card</ion-text>
    <ion-toggle checked="true"></ion-toggle>
  </div>

  <div class="lines"></div>

  <div class="list" >
    <div class="icon2">
      <ion-img src="../../../../assets/image/s52.png" style="height: 26px;width: 26px;" />
    </div>
    <ion-text class="b14" style="margin-left: 12px;flex: 1;">Disable contactless</ion-text>
    <ion-toggle checked="true"></ion-toggle>
  </div>

  <div class="lines"></div>

  <div class="list" >
    <div class="icon2">
      <ion-icon name="lock-closed-outline" style="font-size: 24px;color: #FB923C;" />
    </div>
    <ion-text class="b14" style="margin-left: 12px;flex: 1;">Disable magstripe</ion-text>
    <ion-toggle ></ion-toggle>
  </div>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-button routerLink="/tabs/card" expand="block">Save</ion-button>
  </ion-toolbar>
</ion-footer>
