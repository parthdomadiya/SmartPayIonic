<ion-header [translucent]="false" style="box-shadow: none;">
  <ion-toolbar color="bg" style="--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/tabs/activity">
      <div class="icon">
        <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
      </div>
    </ion-buttons>
    <ion-title class="b18" style="text-align: center;">My Bank</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-text class="apptitle">Your bank account</ion-text>

  <div class="boxo list" style="margin-top: 15px;">
    <div class="icon2" style="border-radius: 30px;">
      <ion-img src="../../../../assets/image/s46.png" style="height: 32px;width: 32px;margin-left: 10px;" />
      <ion-img src="../../../../assets/image/s72.png"
        style="height: 20px;width: 20px;position: relative;right: 0;bottom: -12px;" />
    </div>
    <div style="margin-left: 12px;flex: 1;">
      <ion-text class="s16">Bank of America</ion-text>
      <div style="margin-top: 5px;">
        <ion-text class="m12" style="color: var(--ion-color-dis);">Anabella Angela</ion-text>
      </div>
    </div>
    <ion-icon name="chevron-down" style="font-size: 20px;color: #9CA3AF;" />
  </div>

  <div class="scroll list" style="margin-top: 20px;">
    <div>
      <div class="boxo list" style="width: 320px;">
        <div class="icon2" style="border-radius: 30px;">
          <ion-img src="../../../../assets/image/s46.png" style="height: 32px;width: 32px;margin-left: 10px;" />
          <ion-img src="../../../../assets/image/s72.png"
            style="height: 20px;width: 20px;position: relative;right: 0;bottom: -12px;" />
        </div>
        <div style="margin-left: 12px;flex: 1;">
          <ion-text class="s16">U.S Bank</ion-text>
          <div style="margin-top: 5px;">
            <ion-text class="m12" style="color: var(--ion-color-dis);">Anabella Angela</ion-text>
          </div>
        </div>
        <ion-icon name="chevron-down" style="font-size: 20px;color: #9CA3AF;" />
      </div>
    </div>
    <div>
      <div class="icon1" style="margin-left: 10px;height: 82px;width: 60px;">
        <ion-icon name="trash-outline" style="font-size: 25px;color: #F75555;" />
      </div>
    </div>
  </div>

  <div class="box list" style="margin-top: 20px;">
    <ion-img [src]="darkMode?'../../../../assets/image/s47d.png':'../../../../assets/image/s47.png'"
      style="height: 20px;width: 20px;" />
    <ion-text class="b16" style="margin-left: 12px;flex: 1;">Add new bank</ion-text>
    <ion-icon name="chevron-forward" style="font-size: 20px;color: var(--ion-color-txt);" />
  </div>

</ion-content>
